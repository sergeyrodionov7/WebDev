<html>

        <title>Форма авторизации</title>
        <link rel="stylesheet" href="./styles.css" />

    </head>
    <body>
        <header>Авторизация</header>

                <h4 class="card-header">Использовать логин и пароль</h4 >
                <input type="email" />
                <input type="password" />
                <div>

                </div>
                <button onclick="GetRandColor(event)" id="Main">Вход</button>
                <br/>
                <div>
                    <button onclick="GetRandColor(event)" id="Max" >Войти через MAX</button>
                    <button onclick="GetRandColor(event)" id="VK">Войти через VK</button>
                </div>
            </div>
        </main>
        <footer>Подвал</footer>
    </body>
